name: Mirror from Aevion-Verifiable-AI monorepo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Weekly, Sunday 06:00 UTC
  repository_dispatch:
    types: [monorepo-release]

permissions:
  contents: write

# Only one mirror run at a time; cancel an in-progress run if a newer trigger
# arrives. Keeps Actions minutes predictable and avoids duplicate commits.
concurrency:
  group: mirror-from-monorepo
  cancel-in-progress: true

jobs:
  mirror:
    name: Sync governed subset from monorepo
    runs-on: ubuntu-latest
    # Prevent accidental runs on forks; this repo only makes sense in the
    # Aevion-ai org.
    if: github.repository == 'Aevion-ai/ProofOS'
    timeout-minutes: 30
    steps:
      - name: Checkout ProofOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout canonical monorepo
        # Deploy keys are disabled on the monorepo, so we use a PAT with
        # contents:read (and metadata:read) scope for Aevion-ai/Aevion-Verifiable-AI.
        uses: actions/checkout@v4
        with:
          repository: Aevion-ai/Aevion-Verifiable-AI
          path: .monorepo
          token: ${{ secrets.MONOREPO_MIRROR_TOKEN }}
          fetch-depth: 1

      - name: Sync allow-listed paths
        id: sync
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          source_sha = subprocess.check_output(
              ["git", "-C", ".monorepo", "rev-parse", "HEAD"], text=True
          ).strip()
          last_sync = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"source_sha={source_sha}\n")
              f.write(f"last_sync={last_sync}\n")

          manifest = Path("MIRROR_MANIFEST.md")
          text = manifest.read_text(encoding="utf-8")

          RESTRICTED_PARTS = {".git", ".github", ".jules", ".monorepo", ".gitmodules", ".gitattributes"}

          def is_restricted_part(parts: tuple[str, ...]) -> bool:
              return any(part in RESTRICTED_PARTS or part.startswith(".git") for part in parts)

          def validate_mirror_path(base_dir: Path, rel_str: str) -> Path | None:
              raw = rel_str.strip()
              if not raw:
                  return None
              # Reject absolute paths (POSIX leading slash, Windows drive or UNC)
              if raw.startswith(("/", "\\")) or ":" in raw[:3] or Path(raw).is_absolute():
                  return None
              raw_parts = Path(raw).parts
              if ".." in raw_parts or is_restricted_part(raw_parts):
                  return None
              base_res = base_dir.resolve()
              cand_res = (base_dir / raw).resolve()
              if not cand_res.is_relative_to(base_res) or cand_res == base_res:
                  return None
              rel_res = cand_res.relative_to(base_res)
              if is_restricted_part(rel_res.parts):
                  return None
              # Symlink escape check: inspect candidate and intermediate components
              curr = base_dir / raw
              try:
                  while curr.resolve() != base_res:
                      if curr.is_symlink():
                          target = curr.resolve()
                          if not target.is_relative_to(base_res) or is_restricted_part(target.relative_to(base_res).parts):
                              return None
                      if curr.parent == curr:
                          break
                      curr = curr.parent
              except (OSError, ValueError):
                  return None
              return cand_res

          base_src = Path(".monorepo")
          repo_root = Path(".")

          for line in text.splitlines():
              m = re.match(r"^\s*src:\s*(.+?)\s*->\s*(.+?)\s*$", line)
              if not m:
                  continue

              src_str = m.group(1)
              dst_str = m.group(2)

              src_path = validate_mirror_path(base_src, src_str)
              if src_path is None:
                  print(f"SKIP: source path rejected by security policy: {src_str}")
                  continue

              dst_path = validate_mirror_path(repo_root, dst_str)
              if dst_path is None:
                  print(f"SKIP: destination path rejected by security policy: {dst_str}")
                  continue

              if not src_path.exists():
                  print(f"SKIP: source not found: {src_str}")
                  continue

              print(f"COPY: {src_str} -> {dst_str}")
              if dst_path.exists():
                  shutil.rmtree(dst_path) if dst_path.is_dir() else dst_path.unlink()
              dst_path.parent.mkdir(parents=True, exist_ok=True)
              if src_path.is_dir():
                  shutil.copytree(src_path, dst_path, symlinks=False)
              else:
                  shutil.copy2(src_path, dst_path)

          text = re.sub(
              r"^(\| `source_commit` \| `)[^`]*(` \|)$",
              rf"\g<1>{source_sha}\g<2>",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r"^(\| `last_sync` \| `)[^`]*(` \|)$",
              rf"\g<1>{last_sync}\g<2>",
              text,
              flags=re.MULTILINE,
          )
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -q

      - name: Configure git
        run: |
          git config user.name "Aevion Mirror Bot"
          git config user.email "mirror@aevion.ai"

      - name: Commit candidate and scan for secrets
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "No changes to mirror."
            exit 0
          fi
          git commit -m "mirror: sync from Aevion-Verifiable-AI (${SOURCE_SHA})"
          docker run --rm -v "$PWD":/tmp -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///tmp/ --since-commit HEAD~1 --branch HEAD --only-verified --fail --no-update
        env:
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}

      - name: Push to main
        if: env.NO_CHANGES != 'true'
        run: |
          git push origin main
