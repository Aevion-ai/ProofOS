name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
        env:
          PYTHONPATH: .
      - name: Oct 29 demo proof artifacts
        run: |
          PYTHONPATH=src python3 -m aevion_runtime.demo --ledger demo-ledger.jsonl > demo-transcript.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oct29-demo-proof
          path: |
            demo-transcript.txt
            demo-ledger.jsonl

  metric-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Recomputes the real Lean inventory; fails if any public surface claims
      # more theorems/files/obligations than the repo contains, or carries
      # RED-gated framing / INTERNAL_ONLY codenames.
      - run: python scripts/metric_gate.py

  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@4512585fd31b26b61437eb10cc9041271fac37b9 # v3.0.2
        id: lean_paths
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        with:
          filters: |
            lean:
              - '**/*.lean'
              - 'lakefile*'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run Lean build
        id: run_lean
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.lean_paths.outputs.lean }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip Lean build (no Lean-related changes)
        if: steps.run_lean.outputs.run != 'true'
        run: echo "Skipping expensive Lean build — no Lean-related files changed."
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        if: steps.run_lean.outputs.run == 'true'
        with:
          use-mathlib-cache: true
