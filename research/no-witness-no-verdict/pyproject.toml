[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowitnessnoverdict"
version = "0.1.0"
description = "No Witness, No Verdict — fail-closed, receipt-bound state transitions for long-horizon agents"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["nowitnessnoverdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
